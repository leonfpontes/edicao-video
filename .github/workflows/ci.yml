name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Dependências
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Testes de unidade
        run: pytest

      - name: Bibliotecas (catálogos e licenças)
        run: python editor.py biblioteca verificar

      - name: Faixa usada na regressão
        run: python editor.py biblioteca baixar musicas carefree

      - name: Regressão de todas as marcas
        run: python editor.py testar

      - name: Folhas de teste
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: folhas-de-teste
          path: testes/_tmp/**/*.png
